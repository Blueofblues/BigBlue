<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BigBlue Lounge</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
    }

    #topbar {
      background: #0d1117;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
    }

    #lounge {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #161b22;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(88,166,255,0.25);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
      color: #58a6ff;
    }

    #online {
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #8b949e;
    }

    #messages {
      margin-bottom: 20px;
      padding: 10px;
      background: #0d1117;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #30363d;
    }

    .message {
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #21262d;
      border-radius: 6px;
      max-width: 80%;
    }

    .me {
      background: #238636;
      margin-left: auto;
      text-align: right;
    }

    .them {
      background: #21262d;
      margin-right: auto;
      text-align: left;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.8;
    }

    .timestamp {
      font-size: 12px;
      color: #8b949e;
    }

    .msg-text {
      margin-top: 4px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }

    button {
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }
  </style>
</head>

<body>

  <section id="lounge">
    <div id="online">You are online</div>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="name" placeholder="Name" required />
      <textarea id="text" placeholder="Share something..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
